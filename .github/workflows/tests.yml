name: PrOximAl tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PROXIMAL_REQUIRE_GUI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt pytest
      - name: Baseline regressions
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, 'tests/test_suite.py'], capture_output=True, text=True, encoding='utf-8')
          output = result.stdout + result.stderr
          print(output)
          if result.returncode:
              detail = output[-14000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Baseline regressions::{detail}')
          sys.exit(result.returncode)
      - name: Core and native window tests
        if: success() || failure()
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q'], capture_output=True, text=True, encoding='utf-8')
          output = result.stdout + result.stderr
          print(output)
          if result.returncode:
              detail = output[-14000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Core and native window tests::{detail}')
          sys.exit(result.returncode)
